name: 每周刷新 ETF 数据

on:
  schedule:
    # 每周一 08:00 北京时间 (UTC 0:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install akshare pandas

      - name: 拉取数据
        env:
          # GitHub Actions 跑在自家服务器,proxy 问题不存在;AkShare 全部接口可用
          AKSHARE_NO_PROXY: '*'
        run: |
          python extract_etf_csv.py
          python extract_us_etf.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/
          git commit -m "chore: 每周刷新 ETF 数据" || exit 0
          git push